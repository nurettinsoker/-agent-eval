[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Open-source agent evaluation platform (CLI + Dashboard)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nurettin Soker", email = "nurettinsoker@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "httpx>=0.26.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
crewai = ["crewai>=0.28.0"]
autogen = ["pyautogen>=0.2.0"]

[project.entry-points]
console_scripts = {agent-eval = "agent_eval.cli:app"}

[project.urls]
Homepage = "https://github.com/nurettinsoker/agent-eval"
Repository = "https://github.com/nurettinsoker/agent-eval"
Issues = "https://github.com/nurettinsoker/agent-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP037"]
extend-select = ["ARG", "PTH", "ERA", "TID", "TRY", "C4", "PIE", "PL", "RET", "SIM", "TCH", "NPY", "PD", "RSE", "LOG"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
show_error_codes = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/agent_eval"]
omit = ["tests/*", "*/__pycache__/*"]